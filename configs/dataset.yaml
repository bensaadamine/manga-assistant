# Panel-extraction defaults for the per-artist LoRA datasets.
#
# Measured on Spy x Family vols 1-2 (Oct 2026): 332 content pages ->
# 2848 panel candidates -> 336 kept -> 319 after text removal.
# Raise min_side or lower max_text to trade count for cleanliness; the
# sensitivity table is in claude/DATASET.md.
extends: base.yaml

dataset:
  # --- stage 0: pages out of the PDFs -------------------------------------
  pages:
    head_drop: 4          # cover, colour plates, title page
    tail_drop: 6          # afterword, ads, back cover

  # --- stage 1: page -> panel boxes ---------------------------------------
  panels:
    gutter_frac: 0.004    # a wide gutter, as a fraction of page height
    max_ink_frac: 0.02    # ...may carry this much ink and still count
    thin_frac: 0.0012     # a thin gutter (manga gutters are only a few px)
    thin_ink_frac: 0.004  # ...must be almost perfectly white
    line_ink_frac: 0.90   # a drawn panel border: a row/col this inky
    min_part_ink: 0.03    # refuse a cut that carves off a near-empty strip
    min_side_frac: 0.07   # stop recursing below this fraction of page height

  # --- stage 2: what survives ---------------------------------------------
  filters:
    min_side: 448         # native px; everything kept is DOWNscaled to 512
    aspect: [0.35, 3.0]
    ink: [0.02, 0.70]     # blank page / solid black fill
    max_text: 0.30        # fraction of the panel under lettering
    max_big: 0.02         # oversized type: chapter logos and drawn SFX

  # --- stage 3: lettering removal -----------------------------------------
  clean:
    pad_frac: 0.012       # collar inspected around each lettering block
    ring_light: 0.80      # collar this pale -> erase the whole block
    min_ground: 0.45      # below this the type is on artwork -> drop the panel

  # --- stage 4: what kohya gets -------------------------------------------
  emit:
    min_side: 512
    max_side: 1024        # centre-crop the long axis past this
    repeats: 2            # kohya's "<repeats>_<trigger>" folder. Was 10: see TRAINING.md, finding 18
    holdout: 80           # panels withheld from training, for FID
    base_tags: [monochrome, greyscale, comic, manga style, screentone]

  # --- stage 5: character crops (Magi boxes) ----------------------------
  # Values that built dataset v2 (891 crops -> 647 after the tag filter).
  crops:
    repeats: 1            # panels are weighted 2x: 1 epoch = 2 x panels + crops
    min_px: 256           # short side of Magi's character box
    margin: 0.05          # air around the box, no square pad
    overlap: 0.15         # max share of the box another character covers
    aspect: [0.5, 2.0]    # kills eye-slits and tall strips
    max_text: 0.10        # max share of the crop under Magi text boxes
    max_side: 1024        # = max_bucket_reso, downscale only
    ink: 200              # darker than this = ink, for lettering erase
    pad_px: 4             # slack around tight text boxes
    max_glyph: 0.08       # a letter is never taller than 8% of the page

  # --- stage 6: WD14 captions, then drop what teaches nothing -------------
  tag:
    threshold: 0.35
    character_threshold: 0.85
    drop_tags: [no humans, close-up, eye focus]   # backgrounds, an eye, a mouth
